input:
  channels: 1
  spatial_size: 256
  normalize: minmax_0_1   # TODO: Med3D pretrained 가중치와 정규화 방식이 다를 수 있음 -- 확인 필요

model:
  backbone: resnet18_3d
  proj_dim: 256
  pretrained_path: ../pretrained/resnet_18.pth

train:
  optimizer: adamw
  betas: [0.9, 0.999]
  batch_size: 16
  loss: focal
  focal_alpha: 0.25
  focal_gamma: 2
  checkpoint_dir: ../checkpoints
